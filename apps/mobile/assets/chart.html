<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KLine Chart</title>
  <script src="https://unpkg.com/klinecharts@10.0.3/dist/klinecharts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    #chart {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    let chart = null;
    let currentTheme = 'dark';

    // Initialize chart
    function initChart(theme = 'dark') {
      currentTheme = theme;
      const colors = theme === 'dark' ? {
        background: '#0f172a',
        text: '#f1f5f9',
        grid: '#334155',
        crosshair: '#64748b',
        up: '#22c55e',
        down: '#ef4444',
        ma5: '#f59e0b',
        ma10: '#3b82f6',
        ma20: '#a855f7',
        ma60: '#ec4899',
      } : {
        background: '#ffffff',
        text: '#0f172a',
        grid: '#e2e8f0',
        crosshair: '#64748b',
        up: '#16a34a',
        down: '#dc2626',
        ma5: '#d97706',
        ma10: '#2563eb',
        ma20: '#9333ea',
        ma60: '#db2777',
      };

      if (chart) {
        chart.dispose();
      }

      chart = klinecharts.init('chart', {
        styles: {
          grid: {
            show: true,
            horizontal: { color: colors.grid },
            vertical: { color: colors.grid },
          },
          candle: {
            priceMark: {
              high: { color: colors.up },
              low: { color: colors.down },
              last: { color: colors.text },
            },
            bar: {
              upColor: colors.up,
              downColor: colors.down,
              noChangeColor: colors.text,
            },
            tooltip: {
              text: { color: colors.text },
            },
          },
          indicator: {
            text: { color: colors.text },
            lines: [
              { color: colors.ma5 },
              { color: colors.ma10 },
              { color: colors.ma20 },
              { color: colors.ma60 },
            ],
          },
          xAxis: {
            axisLine: { color: colors.grid },
            tickText: { color: colors.text },
          },
          yAxis: {
            axisLine: { color: colors.grid },
            tickText: { color: colors.text },
          },
          crosshair: {
            horizontal: { color: colors.crosshair },
            vertical: { color: colors.crosshair },
            text: { color: colors.text, backgroundColor: colors.background },
          },
        },
        toolbar: {
          visible: 'always',
          items: [
            { type: 'drawline' },
            { type: 'drawhorizontalline' },
            { type: 'drawfibonacci' },
            { type: 'zoom' },
            { type: 'reset' },
          ],
        },
      });

      // Add default indicators
      chart.createIndicator('MA', false, { id: 'candle_pane' });
      chart.createIndicator('VOL', true, { id: 'indicator_pane' });

      // Enable crosshair
      chart.setCrosshair({});
    }

    // Update chart data
    function updateData(data) {
      if (!chart || !data || !data.length) return;
      
      // Convert data format
      const klineData = data.map(item => ({
        timestamp: item.timestamp,
        open: item.open,
        high: item.high,
        low: item.low,
        close: item.close,
        volume: item.volume || 0,
      }));

      chart.applyNewData(klineData);
    }

    // Add indicator
    function addIndicator(name, paneId) {
      if (!chart) return;
      chart.createIndicator(name, false, { id: paneId || 'candle_pane' });
    }

    // Remove indicator
    function removeIndicator(paneId) {
      if (!chart) return;
      chart.removeIndicator(paneId);
    }

    // Change theme
    function changeTheme(theme) {
      initChart(theme);
    }

    // Handle messages from React Native
    window.addEventListener('message', (event) => {
      try {
        const message = JSON.parse(event.data);
        switch (message.type) {
          case 'init':
            initChart(message.theme || 'dark');
            break;
          case 'update':
            updateData(message.data);
            break;
          case 'addIndicator':
            addIndicator(message.name, message.paneId);
            break;
          case 'removeIndicator':
            removeIndicator(message.paneId);
            break;
          case 'theme':
            changeTheme(message.theme);
            break;
        }
      } catch (e) {
        console.error('Message error:', e);
      }
    });

    // Notify React Native that chart is ready
    window.addEventListener('load', () => {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ready' }));
    });
  </script>
</body>
</html>
